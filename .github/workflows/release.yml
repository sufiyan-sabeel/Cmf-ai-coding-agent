name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0). Leave empty to use the pushed tag.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Determine version
      id: version
      run: |
        if [ -n "${{ inputs.tag }}" ]; then
          RAW="${{ inputs.tag }}"
        else
          RAW="${GITHUB_REF#refs/tags/}"
        fi
        VERSION="${RAW#v}"
        echo "tag=$RAW"          >> "$GITHUB_OUTPUT"
        echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
        echo "Release tag: $RAW  version: $VERSION"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android NDK and CMake
      run: |
        # ubuntu-latest has Android SDK at $ANDROID_HOME
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: gradle-${{ runner.os }}-

    - name: Make Gradle executable
      run: chmod +x gradlew

    - name: Create placeholder runtime assets for online build
      run: |
        mkdir -p dist/runtime-bundles
        touch dist/runtime-bundles/pocketdev-agy-arm64-2026.09.1.tar.zst

    - name: Run unit tests
      run: ./gradlew testOnlineDebugUnitTest --no-daemon

    - name: Build release APK
      run: ./gradlew assembleOnlineRelease --no-daemon

    - name: Locate and verify APK
      id: apk
      run: |
        mkdir -p release

        APK_DIR="app/build/outputs/apk/online/release"
        if [ ! -d "$APK_DIR" ]; then
          echo "::error::APK output directory not found: $APK_DIR"
          find app/build/outputs -type f -name '*.apk' 2>/dev/null || echo "No APK files found"
          exit 1
        fi

        APK=$(find "$APK_DIR" -name '*.apk' ! -name '*unsigned*' ! -name '*aligned*' | head -1)

        if [ -z "$APK" ] || [ ! -f "$APK" ]; then
          APK=$(find "$APK_DIR" -name '*.apk' | head -1)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::No APK files found"
            exit 1
          fi
        fi

        SIZE=$(stat -c%s "$APK")
        if [ "$SIZE" -eq 0 ]; then
          echo "::error::APK file is empty"
          exit 1
        fi

        MAGIC=$(xxd -l 2 -p "$APK")
        if [ "$MAGIC" != "504b" ]; then
          echo "::error::File is not a valid APK"
          exit 1
        fi

        FNAME="CMF-Coding-Agent-v${{ steps.version.outputs.VERSION }}.apk"
        cp "$APK" "release/$FNAME"
        FINAL_SIZE=$(stat -c%s "release/$FNAME")

        echo "path=release/$FNAME" >> "$GITHUB_OUTPUT"
        echo "filename=$FNAME"     >> "$GITHUB_OUTPUT"
        echo "size=$FINAL_SIZE"    >> "$GITHUB_OUTPUT"

        echo "APK verified: $FNAME ($FINAL_SIZE bytes)"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: "Mobile CMF Coding Agent v${{ steps.version.outputs.VERSION }}"
        tag_name: ${{ steps.version.outputs.tag }}
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## Mobile CMF Coding Agent v${{ steps.version.outputs.VERSION }}

          ### What's included
          - Mobile CMF Coding Agent Android application (online variant)
          - AI coding workspace with Claude Code, DeepSeek Harness, and Antigravity CLI support
          - Ubuntu 20.04 LTS PRoot subsystem
          - On-device terminal and file management
          - Persistent project sessions
          - Keystore-grade AES-256 GCM encryption for API keys
          - Optional Python, Android, C/C++, and PHP toolchains

          ### Build information
          - **Application ID:** com.jarves.mh
          - **Target ABI:** arm64-v8a
          - **Minimum SDK:** Android 9.0 (API 28)
          - **Signing:** Debug-signed (unsigned release)

          ### Maintainer
          **Umaiz Sufiyan**
          - GitHub: https://github.com/sufiyan-sabeel
          - Instagram: https://instagram.com/umaizsufiyan.78

          ### Attribution
          Based on the upstream [Mobile Harness](https://github.com/techjarves/Mobile-Harness) project by Tech Jarves, licensed under MIT.
        files: ${{ steps.apk.outputs.path }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Release summary
      run: |
        echo ""
        echo "RELEASE COMPLETE"
        echo "Tag:     ${{ steps.version.outputs.tag }}"
        echo "Version: ${{ steps.version.outputs.version }}"
        echo "APK:     ${{ steps.apk.outputs.filename }}"
        echo "Size:    ${{ steps.apk.outputs.size }} bytes"
