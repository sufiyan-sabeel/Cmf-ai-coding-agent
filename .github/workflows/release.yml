name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0). Leave empty to use the pushed tag.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Determine version
      id: version
      run: |
        if [ -n "${{ inputs.tag }}" ]; then
          RAW="${{ inputs.tag }}"
        else
          RAW="${GITHUB_REF#refs/tags/}"
        fi
        VERSION="${RAW#v}"
        echo "tag=$RAW"          >> "$GITHUB_OUTPUT"
        echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
        echo "Release tag: $RAW  version: $VERSION"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Android NDK and CMake
      run: |
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: gradle-${{ runner.os }}-

    - name: Make Gradle executable
      run: chmod +x gradlew

    # ── Signing keystore ──────────────────────────────────────────────
    # Ensure a signing keystore exists so release builds are NEVER unsigned.
    # If MH_UPLOAD_* env vars are set, app/build.gradle.kts uses those.
    # Otherwise the release build type falls back to the debug signing config,
    # which uses ~/.android/debug.keystore by default.
    - name: Prepare signing keystore
      run: |
        DEBUG_KS="$HOME/.android/debug.keystore"
        mkdir -p "$(dirname "$DEBUG_KS")"
        if [ ! -f "$DEBUG_KS" ]; then
          echo "Generating debug keystore..."
          keytool -genkeypair -v \
            -keystore "$DEBUG_KS" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "Debug keystore created at $DEBUG_KS"
        else
          echo "Debug keystore already exists at $DEBUG_KS"
        fi
        ls -la "$DEBUG_KS"

    - name: Download runtime bundles for offline build
      run: |
        mkdir -p dist/runtime-bundles

        # Placeholder for online variant (downloaded at install time)
        touch dist/runtime-bundles/pocketdev-agy-arm64-2026.09.1.tar.zst

        # Download runtime bundles for offline variant from upstream releases
        RUNTIME_BASE="https://github.com/techjarves/Mobile-Harness/releases/download/runtime-2026.09.4"
        BUNDLES=(
          "pocketdev-core-arm64-2026.09.5.tar.zst"
          "pocketdev-claude-arm64-2026.09.1.tar.zst"
          "pocketdev-python-arm64-2026.09.2.tar.zst"
          "pocketdev-android-arm64-2026.09.1.tar.zst"
          "pocketdev-dsh-arm64-2026.09.1.tar.zst"
        )

        for BUNDLE in "${BUNDLES[@]}"; do
          echo "Downloading $BUNDLE..."
          curl -fSL -o "dist/runtime-bundles/$BUNDLE" "$RUNTIME_BASE/$BUNDLE" || {
            echo "::warning::Failed to download $BUNDLE — offline variant will lack this bundle"
          }
        done

        echo ""
        echo "Runtime bundles in dist/runtime-bundles/:"
        ls -lh dist/runtime-bundles/

    - name: Run unit tests
      run: ./gradlew testOnlineDebugUnitTest --no-daemon

    # ── Build both Online and Offline release APKs ─────────────────────
    - name: Build Online release APK
      run: ./gradlew assembleOnlineRelease --no-daemon

    - name: Build Offline release APK
      run: ./gradlew assembleOfflineRelease --no-daemon

    # ── Locate, rename, and verify APKs ────────────────────────────────
    - name: Locate and verify APKs
      id: apk
      run: |
        mkdir -p release

        echo ""
        echo "═══════════════════════════════════════════════════════"
        echo "  VERIFYING ONLINE APK"
        echo "═══════════════════════════════════════════════════════"

        ONLINE_DIR="app/build/outputs/apk/online/release"
        ONLINE_APK=$(find "$ONLINE_DIR" -name '*.apk' ! -name '*unsigned*' | head -1)
        if [ -z "$ONLINE_APK" ]; then
          ONLINE_APK=$(find "$ONLINE_DIR" -name '*.apk' | head -1)
        fi

        if [ -z "$ONLINE_APK" ] || [ ! -f "$ONLINE_APK" ]; then
          echo "::error::No Online APK found in $ONLINE_DIR"
          find app/build/outputs -type f -name '*.apk' 2>/dev/null || true
          exit 1
        fi

        ONLINE_SIZE=$(stat -c%s "$ONLINE_APK")
        echo "  ✅ File: $ONLINE_APK"
        echo "  ✅ Size: $((ONLINE_SIZE / 1048576)) MB ($ONLINE_SIZE bytes)"

        MAGIC=$(xxd -l 2 -p "$ONLINE_APK")
        if [ "$MAGIC" != "504b" ]; then
          echo "::error::Online APK is not a valid ZIP (magic: $MAGIC)"
          exit 1
        fi
        echo "  ✅ Valid ZIP archive"

        if ! unzip -l "$ONLINE_APK" AndroidManifest.xml >/dev/null 2>&1; then
          echo "::error::Online APK missing AndroidManifest.xml"
          exit 1
        fi
        echo "  ✅ Contains AndroidManifest.xml"

        if ! unzip -l "$ONLINE_APK" 'classes*.dex' >/dev/null 2>&1; then
          echo "::error::Online APK missing classes.dex"
          exit 1
        fi
        echo "  ✅ Contains DEX files"

        ARM64_LIBS=$(unzip -l "$ONLINE_APK" 'lib/arm64-v8a/*.so' 2>/dev/null | grep -c '\.so' || true)
        echo "  ✅ arm64-v8a native libraries: $ARM64_LIBS"

        # Check for v1 signature files (META-INF/*.RSA, *.DSA, *.EC, *.SF)
        SIG_COUNT=$(unzip -l "$ONLINE_APK" 'META-INF/*' 2>/dev/null | grep -cE '\.(RSA|DSA|EC|SF)$' || true)
        if [ "$SIG_COUNT" -lt 2 ]; then
          echo "::error::Online APK appears UNSIGNED (only $SIG_COUNT signature files)"
          exit 1
        fi
        echo "  ✅ Signature files present ($SIG_COUNT)"

        ONLINE_FNAME="CMF-Coding-Agent-Online-v${{ steps.version.outputs.VERSION }}.apk"
        cp "$ONLINE_APK" "release/$ONLINE_FNAME"
        echo "  ✅ Saved: release/$ONLINE_FNAME"

        echo ""
        echo "═══════════════════════════════════════════════════════"
        echo "  VERIFYING OFFLINE APK"
        echo "═══════════════════════════════════════════════════════"

        OFFLINE_DIR="app/build/outputs/apk/offline/release"
        OFFLINE_APK=$(find "$OFFLINE_DIR" -name '*.apk' ! -name '*unsigned*' | head -1)
        if [ -z "$OFFLINE_APK" ]; then
          OFFLINE_APK=$(find "$OFFLINE_DIR" -name '*.apk' | head -1)
        fi

        if [ -z "$OFFLINE_APK" ] || [ ! -f "$OFFLINE_APK" ]; then
          echo "::error::No Offline APK found in $OFFLINE_DIR"
          find app/build/outputs -type f -name '*.apk' 2>/dev/null || true
          exit 1
        fi

        OFFLINE_SIZE=$(stat -c%s "$OFFLINE_APK")
        echo "  ✅ File: $OFFLINE_APK"
        echo "  ✅ Size: $((OFFLINE_SIZE / 1048576)) MB ($OFFLINE_SIZE bytes)"

        MAGIC2=$(xxd -l 2 -p "$OFFLINE_APK")
        if [ "$MAGIC2" != "504b" ]; then
          echo "::error::Offline APK is not a valid ZIP (magic: $MAGIC2)"
          exit 1
        fi
        echo "  ✅ Valid ZIP archive"

        if ! unzip -l "$OFFLINE_APK" AndroidManifest.xml >/dev/null 2>&1; then
          echo "::error::Offline APK missing AndroidManifest.xml"
          exit 1
        fi
        echo "  ✅ Contains AndroidManifest.xml"

        if ! unzip -l "$OFFLINE_APK" 'classes*.dex' >/dev/null 2>&1; then
          echo "::error::Offline APK missing classes.dex"
          exit 1
        fi
        echo "  ✅ Contains DEX files"

        ARM64_LIBS2=$(unzip -l "$OFFLINE_APK" 'lib/arm64-v8a/*.so' 2>/dev/null | grep -c '\.so' || true)
        echo "  ✅ arm64-v8a native libraries: $ARM64_LIBS2"

        SIG_COUNT2=$(unzip -l "$OFFLINE_APK" 'META-INF/*' 2>/dev/null | grep -cE '\.(RSA|DSA|EC|SF)$' || true)
        if [ "$SIG_COUNT2" -lt 2 ]; then
          echo "::error::Offline APK appears UNSIGNED (only $SIG_COUNT2 signature files)"
          exit 1
        fi
        echo "  ✅ Signature files present ($SIG_COUNT2)"

        OFFLINE_FNAME="CMF-Coding-Agent-Offline-v${{ steps.version.outputs.VERSION }}.apk"
        cp "$OFFLINE_APK" "release/$OFFLINE_FNAME"
        echo "  ✅ Saved: release/$OFFLINE_FNAME"

        # Set outputs
        ONLINE_MB=$((ONLINE_SIZE / 1048576))
        OFFLINE_MB=$((OFFLINE_SIZE / 1048576))
        echo "online_path=release/$ONLINE_FNAME"       >> "$GITHUB_OUTPUT"
        echo "online_filename=$ONLINE_FNAME"           >> "$GITHUB_OUTPUT"
        echo "online_size=$ONLINE_SIZE"                >> "$GITHUB_OUTPUT"
        echo "online_mb=${ONLINE_MB}"                  >> "$GITHUB_OUTPUT"
        echo "offline_path=release/$OFFLINE_FNAME"     >> "$GITHUB_OUTPUT"
        echo "offline_filename=$OFFLINE_FNAME"         >> "$GITHUB_OUTPUT"
        echo "offline_size=$OFFLINE_SIZE"              >> "$GITHUB_OUTPUT"
        echo "offline_mb=${OFFLINE_MB}"                >> "$GITHUB_OUTPUT"

        echo ""
        echo "═══════════════════════════════════════════════════════"
        echo "  ALL APKs VERIFIED ✅"
        echo "  Online:  $ONLINE_FNAME ($ONLINE_MB MB)"
        echo "  Offline: $OFFLINE_FNAME ($OFFLINE_MB MB)"
        echo "═══════════════════════════════════════════════════════"

    # ── Create GitHub Release with both APKs ───────────────────────────
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: "Mobile CMF Coding Agent v${{ steps.version.outputs.VERSION }}"
        tag_name: ${{ steps.version.outputs.tag }}
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## Mobile CMF Coding Agent v${{ steps.version.outputs.VERSION }}

          Both editions contain the complete Mobile CMF Coding Agent app and support secure in-app updates.

          ---

          ### Online Edition
          **${{ steps.apk.outputs.online_mb }} MB · Recommended**

          Start with the smaller APK. Core, Python, and Android runtime bundles are downloaded only when needed.

          [Download Online APK](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/${{ steps.apk.outputs.online_filename }})

          ---

          ### Offline Edition
          **${{ steps.apk.outputs.offline_mb }} MB · Everything included**

          Includes the Core, Python, and Android runtime bundles for setup with limited or unavailable internet.

          [Download Offline APK](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/${{ steps.apk.outputs.offline_filename }})

          ---

          ### What's included
          - AI coding workspace with Claude Code, DeepSeek Harness, and Antigravity CLI support
          - Ubuntu 20.04 LTS PRoot subsystem
          - On-device terminal and file management
          - Persistent project sessions
          - Keystore-grade AES-256 GCM encryption for API keys
          - Optional Python, Android, C/C++, and PHP toolchains

          ### Build information
          - **Application ID:** com.jarves.mh
          - **Target ABI:** arm64-v8a
          - **Minimum SDK:** Android 9.0 (API 28)
          - **Target SDK:** Android 13.0 (API 33)
          - **Signing:** Release-signed

          ### Maintainer
          **Umaiz Sufiyan**
          - GitHub: https://github.com/sufiyan-sabeel
          - Instagram: https://instagram.com/umaizsufiyan.78

          ### Attribution
          Based on the upstream [Mobile Harness](https://github.com/techjarves/Mobile-Harness) project by Tech Jarves, licensed under MIT.
        files: |
          ${{ steps.apk.outputs.online_path }}
          ${{ steps.apk.outputs.offline_path }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Release summary
      run: |
        echo ""
        echo "═══════════════════════════════════════════════════════"
        echo "  RELEASE COMPLETE — BOTH EDITIONS"
        echo "═══════════════════════════════════════════════════════"
        echo "  Tag:        ${{ steps.version.outputs.tag }}"
        echo "  Version:    ${{ steps.version.outputs.version }}"
        echo "  Online:     ${{ steps.apk.outputs.online_filename }}  (${{ steps.apk.outputs.online_mb }} MB)"
        echo "  Offline:    ${{ steps.apk.outputs.offline_filename }}  (${{ steps.apk.outputs.offline_mb }} MB)"
        echo "  Release:    https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}"
        echo "═══════════════════════════════════════════════════════"
